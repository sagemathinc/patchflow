name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Verify OIDC environment
        run: |
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node --eval "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - run: npm publish --access public --provenance --loglevel verbose
